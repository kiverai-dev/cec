version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/db/app.db
      - API_URL=${API_URL:-http://localhost:8080}
      - APP_NAME=ТестАналитики
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - MAX_FILE_SIZE_MB=50
    restart: unless-stopped

  # Раскомментируйте этот сервис если хотите использовать локальный llama.cpp
